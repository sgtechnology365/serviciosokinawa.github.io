<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Conexión Cruda - Okinawa</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #fff; color: #000; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .error { color: red; font-weight: bold; }
        .exito { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🛠️ Panel de Diagnóstico de Datos Crudos</h2>
    <div id="estado-conexion">Conectando al servidor...</div>

    <!-- Tabla simple para inyectar los datos directos -->
    <table id="tabla-datos" style="display: none;">
        <thead>
            <tr id="encabezados-tabla"></tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
    </table>

    <script>
        // CONFIGURACIÓN CRÍTICA DIRECTA
        const AIRTABLE_TOKEN = 'patOvlESYw4gFYbK9.11a911ea7bd73cf457192d913301b9c6a57883ee026030bd5c5af356e10e2fd3'; // REEMPLAZA CON TU TOKEN REAL
        const BASE_ID = 'app471dbUsqrk2x5X';
        const TABLA_NAME = 'CatalogoComercial';

        async function testConexionDirecta() {
            const indicador = document.getElementById("estado-conexion");
            const tabla = document.getElementById("tabla-datos");
            const filaEncabezados = document.getElementById("encabezados-tabla");
            const cuerpoTabla = document.getElementById("cuerpo-tabla");

            // URL explícita fija escrita en texto continuo inmune a recortes
            const urlAPI = "https://airtable.com";
			//const urlAPI = "https://airtable.com" + BASE_ID + "/" + TABLA_NAME + "?maxRecords=50";

            try {
                indicador.innerText = "Consultando dirección: " + urlAPI;
                
                const respuesta = await fetch(urlAPI, {
                    headers: { "Authorization": "Bearer " + AIRTABLE_TOKEN }
                });

                indicador.innerHTML = `Estatus del Servidor: <span class="${respuesta.ok ? 'exito' : 'error'}">${respuesta.status}</span>`;

                if (!respuesta.ok) {
                    indicador.innerHTML += `<br><span class="error">Airtable rechazó el token o las credenciales.</span>`;
                    return;
                }

                const datos = await respuesta.json();
                
                if (!datos.records || datos.records.length === 0) {
                    indicador.innerHTML += "<br>⚠️ La tabla se conectó con éxito, pero está vacía (no hay registros).";
                    return;
                }

                indicador.innerHTML += ` | Registros encontrados: <span class="exito">${datos.records.length}</span>`;

                // --- 1. DETECTAR DINÁMICAMENTE LOS ENCABEZADOS DE LAS COLUMNAS ---
                const todasLasColumnas = new Set();
                datos.records.forEach(reg => {
                    Object.keys(reg.fields).forEach(col => todasLasColumnas.add(col));
                });
                const listaColumnas = Array.from(todasLasColumnas);

                // Inyectar encabezados en la tabla
                listaColumnas.forEach(nombreColumna => {
                    const th = document.createElement("th");
                    th.innerText = nombreColumna;
                    filaEncabezados.appendChild(th);
                });

                // --- 2. INYECTAR LAS FILAS CON DATOS CRUDOS ---
                datos.records.forEach(reg => {
                    const tr = document.createElement("tr");
                    listaColumnas.forEach(nombreColumna => {
                        const td = document.createElement("td");
                        const valor = reg.fields[nombreColumna];
                        
                        // Si el dato es una imagen o adjunto, extrae su texto descriptivo
                        if (typeof valor === 'object' && valor !== null) {
                            td.innerText = "[Archivo/Adjunto u Objeto]";
                        } else {
                            td.innerText = valor !== undefined ? valor : "-";
                        }
                        tr.appendChild(td);
                    });
                    cuerpoTabla.appendChild(tr);
                });

                // Mostrar la tabla una vez cargada
                tabla.style.display = "table";

            } catch (error) {
                indicador.innerHTML = `<span class="error">❌ Error de Red / Fetch abortado:</span> ${error.message}`;
                console.error("Detalle del error:", error);
            }
        }

        // Arrancar inmediatamente al cargar el documento
        document.addEventListener("DOMContentLoaded", testConexionDirecta);
    </script>
</body>
</html>
