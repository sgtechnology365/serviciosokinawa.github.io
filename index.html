<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Comercial Okinawa</title>
    <!-- Vinculamos el archivo de estilos externos -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="muro-whatsapp" class="modal-pub-full">
        <div class="pub-full-content">
            <div class="pub-full-timer">Redirigiendo a WhatsApp en <span id="timer-whatsapp">5</span>s...</div>
            <div class="pub-full-media" id="media-whatsapp"></div>
        </div>
    </div>

    <header>
        <h1>Catálogo Comercial Okinawa</h1>
        <p>Productos diarios y servicios comerciales</p>
        <a href="https://tally.so/r/0QX0KZ" target="_blank" class="btn-publicar">➕ Publicar Anuncio</a>
    </header>

    <div class="banner-patrocinado-top">
        <div class="banner-caja-rotativa" id="espacio-publicitario-rotativo">
            <span class="badge-patrocinio">Patrocinados</span>
        </div>
    </div>

    <div class="navigation-tabs">
        <button class="tab-btn" onclick="cambiarSeccion('productos')">🥖 Productos del Día</button>
        <button class="tab-btn" onclick="cambiarSeccion('servicios')">🛠️ Servicios Profesionales</button>
    </div>

    <div class="search-container">
        <input type="text" id="buscador" class="search-box" placeholder="Buscar por negocio o palabra clave..." oninput="filtrarCatalogo()">
    </div>

    <div class="categories-carousel" id="carrusel-categorias">
        <button class="cat-btn active" onclick="filtrarCategoria('Todos')">🌐 Todo</button>
        <button class="cat-btn" onclick="filtrarCategoria('Salud y bienestar')">❤️ Salud y bienestar</button>
        <button class="cat-btn" onclick="filtrarCategoria('Alimentos y bebidas')">🍎 Alimentos y bebidas</button>
        <button class="cat-btn" onclick="filtrarCategoria('Mecánica y autos')">🚗 Mecánica y autos</button>
        <button class="cat-btn" onclick="filtrarCategoria('Tecnología e informática')">💻 Tecnología e informática</button>
        <button class="cat-btn" onclick="filtrarCategoria('Educación y capacitación')">📚 Educación y capacitación</button>
        <button class="cat-btn" onclick="filtrarCategoria('Belleza y cuidado personal')">✨ Belleza y cuidado</button>
        <button class="cat-btn" onclick="filtrarCategoria('Construcción y ferretería')">🧱 Construcción y ferretería</button>
        <button class="cat-btn" onclick="filtrarCategoria('Transporte y encomiendas')">📦 Transporte y envíos</button>
        <button class="cat-btn" onclick="filtrarCategoria('Tiendas y comercio')">🏪 Tiendas y comercio</button>
        <button class="cat-btn" onclick="filtrarCategoria('Otros servicios')">⚙️ Otros servicios</button>
    </div>

    <div class="container">
        <div id="seccion-productos" class="seccion-catalogo">
            <div id="contenedor-productos" class="catalogo-grid"></div>
        </div>
        <div id="seccion-servicios" class="seccion-catalogo">
            <div id="contenedor-servicios" class="catalogo-grid"></div>
        </div>
    </div>

    <div id="modal-detalle" class="modal" onclick="cerrarModalExterno(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModal()">&times;</span>
            <div id="modal-imagen-contenedor" class="modal-img-container"></div>
            <div class="modal-body">
                <div id="modal-badge-contenedor"></div>
                <h2 id="modal-nombre-comercial" class="modal-nombre"></h2>
                <h3 id="modal-titulo-anuncio" class="modal-titulo"></h3>
                <p id="modal-descripcion" class="modal-desc"></p>
                <p class="precio" id="modal-precio"></p>
                <div id="modal-contacto-visible"></div>
                <div class="modal-botones">
                    <button id="modal-btn-action-wsp" class="btn-modal btn-wsp" style="border:none; cursor:pointer; width:100%;">📱 Contactar por WhatsApp</button>
                    <a id="modal-btn-mapa" href="#" target="_blank" class="btn-modal btn-map" style="display: none;">📍 Ver Ubicación</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Vinculamos el motor lógico dinámico externo -->
    <script src="script.js"></script>
</body>
</html>
