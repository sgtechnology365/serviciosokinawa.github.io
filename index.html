<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Comercial Okinawa</title>
    <style>
        :root {
            --primary: #25D366;
            --primary-dark: #128C7E;
            --premium: #FFD700;
            --dark: #333;
            --light: #f9f9f9;
            --gray: #666;
            --corporate-blue: #1e3c72;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: var(--dark);
        }
        header {
            background: linear-gradient(135deg, var(--corporate-blue), #2a5298);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .btn-publicar {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 0.8rem 1.8rem;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 1rem;
            transition: background 0.3s;
        }
        .btn-publicar:hover { background-color: var(--primary-dark); }
        h2 {
            border-bottom: 2px solid #ccc;
            padding-bottom: 0.5rem;
            margin-top: 3rem;
            color: var(--corporate-blue);
        }
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .card-premium {
            border: 2px solid var(--premium);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.15);
            background: linear-gradient(to bottom, #fff, #fffdf0);
        }
        .galeria-fotos {
            position: relative;
            background: #eee;
            height: 220px;
            display: flex;
        }
        .galeria-fotos img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-cuerpo {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .badge-plus {
            background-color: var(--premium);
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            align-self: flex-start;
            margin-bottom: 0.5rem;
        }
        .precio {
            font-size: 1.2rem;
            color: #2a5298;
            font-weight: bold;
            margin: 0.5rem 0;
        }
        .contacto-plus {
            background: #eef5ff;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0.5rem 0;
        }
        .botones-accion {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .btn-whatsapp {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 0.7rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn-mapa {
            background-color: #4285F4;
            color: white;
            text-align: center;
            padding: 0.7rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo Comercial Okinawa</h1>
        <p>Plataforma corporativa de productos diarios y servicios empresariales disponibles</p>
        <!-- REEMPLAZAR EL LINK DE ABAJO CON TU ENLACE PROPIO DE TALLY.SO -->
        <a href="https://tally.so/r/0QX0KZ" target="_blank" class="btn-publicar">➕ Publicar Anuncio</a>
    </header>

    <div class="container">
        <!-- Sección de Productos -->
        <h2>🥖 Ofertas de Productos (Vigencia 24h)</h2>
        <div id="contenedor-productos" class="catalogo-grid">
            <p>Cargando catálogo de productos...</p>
        </div>

        <!-- Sección de Servicios -->
        <h2>🛠️ Servicios Comerciales y Profesionales</h2>
        <div id="contenedor-servicios" class="catalogo-grid">
            <p>Cargando servicios disponibles...</p>
        </div>
    </div>

    <script>
        const AIRTABLE_TOKEN = 'patOvlESYw4gFYbK9'; 
        const BASE_ID = 'app471dbUsqrk2x5X';

        async function cargarCatalogo() {
            try {
                const [resAnuncios, resCodigos] = await Promise.all([
                    fetch(`https://api.airtable.com/v0/${BASE_ID}/CatalogoComercial?filterByFormula=%7BAprobado%7D%3D1`, {
                        headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
                    }),
                    fetch(`https://api.airtable.com/v0/${BASE_ID}/CodigosPrepagados`, {
                        headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
                    })
                ]);

                const datosAnuncios = await resAnuncios.json();
                const datosCodigos = await resCodigos.json();

                const codigosValidos = datosCodigos.records ? datosCodigos.records.map(r => r.fields['Código']) : [];

                const contenedorProductos = document.getElementById('contenedor-productos');
                const contenedorServicios = document.getElementById('contenedor-servicios');
                
                contenedorProductos.innerHTML = '';
                contenedorServicios.innerHTML = '';
                const ahora = new Date();

                if(!datosAnuncios.records || datosAnuncios.records.length === 0) {
                    contenedorProductos.innerHTML = '<p>No hay ofertas de productos registradas en este momento.</p>';
                    contenedorServicios.innerHTML = '<p>No hay servicios activos registrados actualmente.</p>';
                    return;
                }

                datosAnuncios.records.forEach(registro => {
                    const campos = registro.fields;
                    const tipo = campos['Tipo de Publicación'];
                    const codigoIngresado = campos['Código de Pago Plus'];

                    const esPlusReal = campos['Plan / Nivel'] === 'Plus' && codigosValidos.includes(codigoIngresado);

                    if (tipo === 'Producto') {
                        const fechaCreacion = new Date(campos['Fecha de Publicación'] || registro.createdTime);
                        const diferenciaHoras = (ahora - fechaCreacion) / (1000 * 60 * 60);
                        if (diferenciaHoras > 24) return; 
                    }

                    let imagenesHtml = '';
                    if (campos.Fotos && campos.Fotos.length > 0) {
                        imagenesHtml += `<img src="${campos.Fotos.url}" class="card-img-principal">`;
                    } else {
                        imagenesHtml = `<img src="https://via.placeholder.com/300x220?text=Sin+Imagen" class="card-img-principal">`;
                    }

                    const numeroWhatsApp = campos['Teléfono de WhatsApp'] || '';
                    const textoMensaje = encodeURIComponent(`Hola, solicito información sobre el anuncio de "${campos['Título del Anuncio']}" visto en el Catálogo de Okinawa.`);
                    
                    const infoContactoHtml = esPlusReal 
                        ? `<p class="contacto-plus">📱 Contacto: ${numeroWhatsApp}</p>` 
                        : '';

                    const botonMapasHtml = (esPlusReal && campos['Enlace de Google Maps'])
                        ? `<a href="${campos['Enlace de Google Maps']}" target="_blank" class="btn-mapa">📍 Ver Ubicación</a>`
                        : '';

                    const tarjetaHtml = `
                        <div class="card ${esPlusReal ? 'card-premium' : 'card-estandar'}">
                            <div class="galeria-fotos">
                                ${imagenesHtml}
                            </div>
                            <div class="card-cuerpo">
                                ${esPlusReal ? '<span class="badge-plus">Destacado ✨</span>' : ''}
                                <h3>${campos['Título del Anuncio'] || 'Anuncio sin título'}</h3>
                                <p class="descripcion">${campos['Descripción o Actividad'] || ''}</p>
                                <p class="precio">Precio: ${campos['Precio / Tarifa'] || 'A consultar'}</p>
                                ${infoContactoHtml}
                                <div class="botones-accion">
                                    <a href="https://wa.me/${numeroWhatsApp}?text=${textoMensaje}" target="_blank" class="btn-whatsapp">Contactar por WhatsApp</a>
                                    ${botonMapasHtml}
                                </div>
                            </div>
                        </div>
                    `;

                    if (tipo === 'Producto') {
                        contenedorProductos.innerHTML += tarjetaHtml;
                    } else if (tipo === 'Servicio') {
                        contenedorServicios.innerHTML += tarjetaHtml;
                    }
                });

                if(contenedorProductos.innerHTML === '') contenedorProductos.innerHTML = '<p>No hay ofertas de productos vigentes.</p>';
                if(contenedorServicios.innerHTML === '') contenedorServicios.innerHTML = '<p>No hay servicios activos registrados.</p>';

            } catch (error) {
                console.error("Error al procesar el catálogo de anuncios:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>
</html>
